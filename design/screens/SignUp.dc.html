<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>MuscleX · Sign up</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap">
<style>
body{margin:0}
button,input{font-family:inherit}
button{cursor:pointer}
input::placeholder{color:var(--muted)}
</style>
</helmet>
<div style="{{vars}} width: 390px; height: 844px; box-sizing: border-box; padding: 56px 24px 32px; display: flex; flex-direction: column; gap: 24px; background: var(--bg); color: var(--text); font-family: Inter, system-ui, sans-serif; overflow: hidden">
  <a href="Main.dc.html" aria-label="Back" style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid var(--line); background: var(--surface); color: var(--text); display: flex; align-items: center; justify-content: center">
    <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>
  </a>

  <div style="display: flex; flex-direction: column; gap: 8px">
    <h1 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 32px; font-weight: 700; letter-spacing: -1px">{{heading}}</h1>
    <p style="margin: 0; font-size: 15px; color: var(--muted)">{{sub}}</p>
  </div>

  <div role="group" aria-label="Account" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; padding: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px">
    <sc-for list="{{modes}}" as="m" hint-placeholder-count="2">
      <button onClick="{{m.pick}}" aria-pressed="{{m.on}}" style="{{m.style}}">{{m.label}}</button>
    </sc-for>
  </div>

  <div style="display: flex; flex-direction: column; gap: 14px">
    <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600; color: var(--muted)">Email
      <input type="email" placeholder="you@example.com" autocomplete="email" style="height: 52px; padding: 0 16px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface); color: var(--text); font-size: 16px; outline: none">
    </label>
    <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600; color: var(--muted)">Password
      <div style="display: flex; align-items: center; height: 52px; padding: 0 6px 0 16px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface)">
        <input type="{{pwType}}" placeholder="At least 8 characters" style="flex: 1; height: 48px; border: 0; background: transparent; color: var(--text); font-size: 16px; outline: none">
        <button onClick="{{togglePw}}" aria-label="{{pwLabel}}" style="width: 44px; height: 44px; border: 0; background: transparent; color: var(--muted); display: flex; align-items: center; justify-content: center">
          <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>
    </label>
    <sc-if value="{{isLogin}}" hint-placeholder-val="{{ false }}">
      <a href="#" style="align-self: flex-end; font-size: 13px; font-weight: 600; color: var(--accentInk); text-decoration: none">Forgot password?</a>
    </sc-if>
  </div>

  <a href="{{next}}" style="height: 56px; border-radius: 16px; background: var(--accent); color: var(--onAccent); font-size: 16px; font-weight: 700; text-decoration: none; display: flex; align-items: center; justify-content: center">{{cta}}</a>

  <div style="display: flex; align-items: center; gap: 12px; color: var(--muted); font-size: 13px">
    <div style="flex: 1; height: 1px; background: var(--line)"></div>or<div style="flex: 1; height: 1px; background: var(--line)"></div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 10px">
    <a href="{{next}}" style="height: 52px; border-radius: 16px; border: 1px solid var(--line); background: var(--surface); color: var(--text); font-size: 15px; font-weight: 600; text-decoration: none; display: flex; align-items: center; justify-content: center; gap: 10px">
      <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 12h8"/></svg>Continue with Google</a>
    <a href="{{next}}" style="height: 52px; border-radius: 16px; border: 1px solid var(--line); background: var(--surface); color: var(--text); font-size: 15px; font-weight: 600; text-decoration: none; display: flex; align-items: center; justify-content: center; gap: 10px">
      <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="3" width="14" height="18" rx="3"/><path d="M11 18h2"/></svg>Continue with Apple</a>
  </div>

  <p style="margin: auto 0 0; font-size: 12px; line-height: 1.5; color: var(--muted); text-align: center">By continuing you agree to the MuscleX <a href="#" style="color: var(--text)">Terms</a> and <a href="#" style="color: var(--text)">Privacy Policy</a>.</p>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"accent":{"editor":"color","default":"#C6F432","options":["#C6F432","#FF8A4C","#7CC8FF","#E9B8FF"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { mode: 'signup', showPw: false };
  }
  theme() {
    let p = {};
    try { p = JSON.parse(window.localStorage.getItem('musclex.prefs') || '{}') || {}; } catch (e) { p = {}; }
    const mode = this.props.theme || p.theme || 'dark';
    const accent = this.props.accent || p.accent || '#C6F432';
    const n = parseInt(accent.slice(1), 16), r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
    const dk = (v) => Math.round(v * 0.48).toString(16).padStart(2, '0');
    const light = mode === 'light';
    const T = light
      ? { bg: '#F5F5F0', surface: '#FFFFFF', surface2: '#ECEDE6', line: '#DEDFD6', text: '#141512', muted: '#5E6158', nav: '#FFFFFF', strong: '#141512', onStrong: '#FFFFFF', flame: '#C2410C', flameSoft: '#FDE7DA', sky: '#1D5FA3', violet: '#7A3FA0' }
      : { bg: '#0E0F0C', surface: '#1A1C17', surface2: '#24271F', line: '#2A2D25', text: '#F2F2EE', muted: '#A3A69C', nav: '#121310', strong: '#F2F2EE', onStrong: '#0E0F0C', flame: '#FF8A4C', flameSoft: '#2A1A10', sky: '#7CC8FF', violet: '#E9B8FF' };
    const vars = Object.keys(T).map((k) => '--' + k + ':' + T[k]).join(';') + ';--accent:' + accent + ';--accentInk:' + (light ? '#' + dk(r) + dk(g) + dk(b) : accent) + ';--accentSoft:rgba(' + r + ',' + g + ',' + b + ',' + (light ? 0.18 : 0.14) + ');--onAccent:#0E0F0C;';
    return { vars, mode, accent, light };
  }
  renderVals() {
    const isLogin = this.state.mode === 'login';
    const modes = [['signup', 'Sign up'], ['login', 'Log in']].map(([id, label]) => {
      const on = this.state.mode === id;
      return { label, on, pick: () => this.setState({ mode: id }),
        style: 'height:44px;border:0;border-radius:10px;font-size:14px;font-weight:600;' + (on ? 'background:var(--strong);color:var(--onStrong);' : 'background:transparent;color:var(--muted);') };
    });
    return {
      vars: this.theme().vars,
      modes, isLogin,
      heading: isLogin ? 'Welcome back' : 'Create your account',
      sub: isLogin ? 'Log in to keep your streak going.' : 'Start your journey in under two minutes.',
      cta: isLogin ? 'Log in' : 'Create account',
      next: isLogin ? 'Home.dc.html' : 'Onboarding.dc.html',
      pwType: this.state.showPw ? 'text' : 'password',
      pwLabel: this.state.showPw ? 'Hide password' : 'Show password',
      togglePw: () => this.setState({ showPw: !this.state.showPw })
    };
  }
}
</script>
</body>
</html>
