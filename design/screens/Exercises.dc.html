<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>MuscleX · Exercise library</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap">
<style>
body{margin:0}
button,input{font-family:inherit}
button{cursor:pointer}
input::placeholder{color:var(--muted)}
</style>
</helmet>
<div style="{{vars}} position: relative; width: 390px; height: 844px; display: flex; flex-direction: column; background: var(--bg); color: var(--text); font-family: Inter, system-ui, sans-serif; overflow: hidden">
  <div style="padding: 52px 20px 12px; display: flex; flex-direction: column; gap: 14px; flex-shrink: 0">
    <div style="display: flex; align-items: center; gap: 12px">
      <a href="Workout.dc.html" aria-label="Back to workout" style="width: 44px; height: 44px; flex-shrink: 0; border-radius: 22px; border: 1px solid var(--line); background: var(--surface); color: var(--text); display: flex; align-items: center; justify-content: center">
        <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>
      </a>
      <div style="display: flex; flex-direction: column; gap: 2px">
        <h1 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 24px; font-weight: 700">Exercise library</h1>
        <span style="font-size: 13px; color: var(--muted)">Adding to Push day</span>
      </div>
    </div>
    <label style="display: flex; align-items: center; gap: 10px; height: 50px; padding: 0 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; color: var(--muted)">
      <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Search exercises</span>
      <input type="search" value="{{q}}" onChange="{{onQ}}" placeholder="Search exercises" style="flex: 1; background: transparent; border: 0; outline: none; color: var(--text); font-size: 15px">
    </label>
    <div role="group" aria-label="Muscle group" style="display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px">
      <sc-for list="{{groups}}" as="g" hint-placeholder-count="7">
        <button onClick="{{g.pick}}" aria-pressed="{{g.on}}" style="{{g.style}}">{{g.label}}</button>
      </sc-for>
    </div>
  </div>

  <div style="flex: 1; overflow-y: auto; padding: 0 20px 32px; display: flex; flex-direction: column; gap: 10px">
    <span style="font-size: 12px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 1px">{{countLabel}}</span>
    <sc-for list="{{list}}" as="x" hint-placeholder-count="6">
      <div style="{{x.card}}">
        <button onClick="{{x.toggle}}" aria-expanded="{{x.open}}" style="display: flex; align-items: center; gap: 12px; width: 100%; min-height: 68px; padding: 10px 14px; border: 0; background: transparent; color: var(--text); text-align: left">
          <div style="{{x.badge}}">
            <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 7v10M18 7v10M3 10v4M21 10v4M6 12h12"/></svg>
          </div>
          <div style="display: flex; flex-direction: column; gap: 2px; flex: 1; min-width: 0">
            <span style="font-size: 15px; font-weight: 700">{{x.name}}</span>
            <span style="font-size: 12px; color: var(--muted)">{{x.group}} · {{x.equip}} · {{x.level}}</span>
          </div>
          <sc-if value="{{x.added}}" hint-placeholder-val="{{ false }}">
            <span style="font-size: 12px; font-weight: 700; color: var(--accentInk)">Added</span>
          </sc-if>
        </button>
        <sc-if value="{{x.open}}" hint-placeholder-val="{{ false }}">
          <div style="padding: 0 14px 14px; display: flex; flex-direction: column; gap: 12px">
            <div style="display: flex; flex-wrap: wrap; gap: 6px">
              <sc-for list="{{x.muscles}}" as="m" hint-placeholder-count="3">
                <span style="padding: 6px 10px; border-radius: 8px; background: var(--surface2); font-size: 12px; font-weight: 600">{{m}}</span>
              </sc-for>
            </div>
            <ol style="margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; font-size: 14px; line-height: 1.45">
              <sc-for list="{{x.steps}}" as="s" hint-placeholder-count="3"><li>{{s}}</li></sc-for>
            </ol>
            <div style="display: flex; justify-content: space-between; padding: 10px 12px; border-radius: 12px; background: var(--accentSoft); font-size: 13px">
              <span>Your best</span><strong>{{x.best}}</strong>
            </div>
            <button onClick="{{x.add}}" style="{{x.addStyle}}">{{x.addLabel}}</button>
          </div>
        </sc-if>
      </div>
    </sc-for>
  </div>

  <sc-if value="{{hasAdded}}" hint-placeholder-val="{{ false }}">
    <div style="flex-shrink: 0; padding: 12px 20px 32px; border-top: 1px solid var(--line); background: var(--nav); display: flex; align-items: center; gap: 12px">
      <span style="flex: 1; font-size: 14px; font-weight: 700">{{addedLabel}}</span>
      <a href="Workout.dc.html" style="height: 48px; padding: 0 22px; border-radius: 14px; background: var(--accent); color: var(--onAccent); font-size: 15px; font-weight: 700; text-decoration: none; display: flex; align-items: center">Back to workout</a>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"accent":{"editor":"color","default":"#C6F432","options":["#C6F432","#FF8A4C","#7CC8FF","#E9B8FF"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { q: '', group: 'All', open: 'cablefly', added: {} };
  }
  theme() {
    let p = {};
    try { p = JSON.parse(window.localStorage.getItem('musclex.prefs') || '{}') || {}; } catch (e) { p = {}; }
    const mode = this.props.theme || p.theme || 'dark';
    const accent = this.props.accent || p.accent || '#C6F432';
    const n = parseInt(accent.slice(1), 16), r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
    const dk = (v) => Math.round(v * 0.48).toString(16).padStart(2, '0');
    const light = mode === 'light';
    const T = light
      ? { bg: '#F5F5F0', surface: '#FFFFFF', surface2: '#ECEDE6', line: '#DEDFD6', text: '#141512', muted: '#5E6158', nav: '#FFFFFF', strong: '#141512', onStrong: '#FFFFFF', flame: '#C2410C', flameSoft: '#FDE7DA', sky: '#1D5FA3', violet: '#7A3FA0' }
      : { bg: '#0E0F0C', surface: '#1A1C17', surface2: '#24271F', line: '#2A2D25', text: '#F2F2EE', muted: '#A3A69C', nav: '#121310', strong: '#F2F2EE', onStrong: '#0E0F0C', flame: '#FF8A4C', flameSoft: '#2A1A10', sky: '#7CC8FF', violet: '#E9B8FF' };
    const vars = Object.keys(T).map((k) => '--' + k + ':' + T[k]).join(';') + ';--accent:' + accent + ';--accentInk:' + (light ? '#' + dk(r) + dk(g) + dk(b) : accent) + ';--accentSoft:rgba(' + r + ',' + g + ',' + b + ',' + (light ? 0.18 : 0.14) + ');--onAccent:#0E0F0C;';
    return { vars, mode, accent, light };
  }
  renderVals() {
    const st = this.state;
    const tint = { Chest: '#C6F432', Back: '#7CC8FF', Legs: '#FF8A4C', Shoulders: '#E9B8FF', Arms: '#F2E28A', Core: '#B9F0D8' };
    const EX = [
      { id: 'bench', name: 'Bench press', group: 'Chest', equip: 'Barbell', level: 'Intermediate', muscles: ['Chest', 'Front delts', 'Triceps'], steps: ['Lie back, eyes under the bar, feet flat.', 'Lower the bar to mid-chest with elbows ~45°.', 'Press up and slightly back to lockout.'], best: '82.5 kg × 8' },
      { id: 'cablefly', name: 'Cable chest fly', group: 'Chest', equip: 'Cable', level: 'Beginner', muscles: ['Chest', 'Front delts'], steps: ['Set pulleys at shoulder height, step forward.', 'With soft elbows, sweep hands together in an arc.', 'Return slowly until you feel a chest stretch.'], best: 'Not logged yet' },
      { id: 'pushup', name: 'Push-up', group: 'Chest', equip: 'Bodyweight', level: 'Beginner', muscles: ['Chest', 'Triceps', 'Core'], steps: ['Hands under shoulders, body in a straight line.', 'Lower until your chest nearly touches the floor.', 'Push back up without letting hips sag.'], best: '30 reps' },
      { id: 'row', name: 'Barbell row', group: 'Back', equip: 'Barbell', level: 'Intermediate', muscles: ['Lats', 'Upper back', 'Biceps'], steps: ['Hinge to ~45° with a flat back.', 'Pull the bar to your lower ribs.', 'Lower under control.'], best: '70 kg × 8' },
      { id: 'pulldown', name: 'Lat pulldown', group: 'Back', equip: 'Cable', level: 'Beginner', muscles: ['Lats', 'Biceps'], steps: ['Grip slightly wider than shoulders.', 'Pull the bar to your upper chest, chest up.', 'Let it rise slowly to full stretch.'], best: '60 kg × 10' },
      { id: 'squat', name: 'Back squat', group: 'Legs', equip: 'Barbell', level: 'Intermediate', muscles: ['Quads', 'Glutes', 'Core'], steps: ['Bar on upper back, feet shoulder-width.', 'Sit down and back until thighs are at least parallel.', 'Drive up through mid-foot.'], best: '120 kg × 5' },
      { id: 'rdl', name: 'Romanian deadlift', group: 'Legs', equip: 'Barbell', level: 'Intermediate', muscles: ['Hamstrings', 'Glutes', 'Lower back'], steps: ['Stand tall, soft knees.', 'Push hips back, sliding the bar down your thighs.', 'Squeeze glutes to stand back up.'], best: '100 kg × 8' },
      { id: 'ohp', name: 'Overhead press', group: 'Shoulders', equip: 'Barbell', level: 'Intermediate', muscles: ['Front delts', 'Triceps', 'Upper chest'], steps: ['Bar on front shoulders, glutes tight.', 'Press straight up, moving your head back.', 'Lock out overhead, then lower.'], best: '45 kg × 8' },
      { id: 'lateral', name: 'Lateral raise', group: 'Shoulders', equip: 'Dumbbell', level: 'Beginner', muscles: ['Side delts'], steps: ['Dumbbells at sides, slight lean forward.', 'Raise out to shoulder height, elbows soft.', 'Lower slowly — don’t swing.'], best: '10 kg × 15' },
      { id: 'curl', name: 'Dumbbell curl', group: 'Arms', equip: 'Dumbbell', level: 'Beginner', muscles: ['Biceps', 'Forearms'], steps: ['Elbows pinned at your sides.', 'Curl up while turning palms to face you.', 'Lower all the way down.'], best: '16 kg × 10' },
      { id: 'pushdown', name: 'Triceps pushdown', group: 'Arms', equip: 'Cable', level: 'Beginner', muscles: ['Triceps'], steps: ['Elbows tucked, slight forward lean.', 'Push down until arms are straight.', 'Let the handle rise to elbow height.'], best: '32.5 kg × 12' },
      { id: 'plank', name: 'Plank', group: 'Core', equip: 'Bodyweight', level: 'Beginner', muscles: ['Abs', 'Obliques', 'Lower back'], steps: ['Forearms under shoulders.', 'Brace abs and squeeze glutes, body straight.', 'Hold and breathe steadily.'], best: '1:45' }
    ];
    const q = st.q.trim().toLowerCase();
    const vis = EX.filter((x) => (st.group === 'All' || x.group === st.group) && (!q || x.name.toLowerCase().indexOf(q) >= 0 || x.muscles.join(' ').toLowerCase().indexOf(q) >= 0));
    const addedCount = Object.keys(st.added).filter((k) => st.added[k]).length;
    return {
      vars: this.theme().vars,
      q: st.q, onQ: (e) => this.setState({ q: e.target.value }),
      groups: ['All', 'Chest', 'Back', 'Legs', 'Shoulders', 'Arms', 'Core'].map((g) => ({ label: g, on: st.group === g, pick: () => this.setState({ group: g }),
        style: 'height:44px;padding:0 16px;flex-shrink:0;border-radius:22px;font-size:14px;font-weight:600;' + (st.group === g ? 'border:0;background:var(--strong);color:var(--onStrong);' : 'border:1px solid var(--line);background:var(--surface);color:var(--text);') })),
      countLabel: vis.length + (vis.length === 1 ? ' exercise' : ' exercises'),
      list: vis.map((x) => {
        const open = st.open === x.id, added = !!st.added[x.id];
        return { ...x, open, added,
          toggle: () => this.setState({ open: this.state.open === x.id ? null : x.id }),
          add: () => this.setState({ added: { ...this.state.added, [x.id]: !this.state.added[x.id] } }),
          addLabel: added ? 'Remove from workout' : 'Add to workout',
          addStyle: 'height:48px;border-radius:14px;font-size:15px;font-weight:700;' + (added ? 'border:1px solid var(--line);background:var(--surface2);color:var(--text);' : 'border:0;background:var(--accent);color:var(--onAccent);'),
          card: 'border-radius:16px;overflow:hidden;background:var(--surface);' + (open ? 'border:1px solid var(--accentInk);' : 'border:1px solid var(--line);'),
          badge: 'width:44px;height:44px;border-radius:12px;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:#0E0F0C;background:' + tint[x.group] };
      }),
      hasAdded: addedCount > 0,
      addedLabel: addedCount + (addedCount === 1 ? ' exercise' : ' exercises') + ' added'
    };
  }
}
</script>
</body>
</html>
