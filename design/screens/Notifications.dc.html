<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>MuscleX · Notifications</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap">
<style>
body{margin:0}
button{font-family:inherit;cursor:pointer}
</style>
</helmet>
<div style="{{vars}} width: 390px; height: 844px; display: flex; flex-direction: column; background: var(--bg); color: var(--text); font-family: Inter, system-ui, sans-serif; overflow: hidden">
  <div style="padding: 52px 20px 12px; display: flex; flex-direction: column; gap: 14px; flex-shrink: 0">
    <div style="display: flex; align-items: center; gap: 12px">
      <a href="Home.dc.html" aria-label="Back to home" style="width: 44px; height: 44px; flex-shrink: 0; border-radius: 22px; border: 1px solid var(--line); background: var(--surface); color: var(--text); display: flex; align-items: center; justify-content: center">
        <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>
      </a>
      <h1 style="margin: 0; flex: 1; font-family: 'Space Grotesk', sans-serif; font-size: 24px; font-weight: 700">Notifications</h1>
      <a href="Profile.dc.html" aria-label="Notification settings" style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid var(--line); background: var(--surface); color: var(--text); display: flex; align-items: center; justify-content: center">
        <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
      </a>
    </div>
    <div style="display: flex; align-items: center; gap: 10px">
      <div role="group" aria-label="Filter" style="flex: 1; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; padding: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px">
        <sc-for list="{{tabs}}" as="t" hint-placeholder-count="3">
          <button onClick="{{t.pick}}" aria-pressed="{{t.on}}" style="{{t.style}}">{{t.label}}</button>
        </sc-for>
      </div>
    </div>
    <div style="display: flex; justify-content: space-between; align-items: center">
      <span style="font-size: 13px; color: var(--muted)">{{unreadLabel}}</span>
      <button onClick="{{markAll}}" style="height: 44px; padding: 0 4px; border: 0; background: transparent; color: var(--accentInk); font-size: 14px; font-weight: 700">Mark all as read</button>
    </div>
  </div>

  <div style="flex: 1; overflow-y: auto; padding: 0 20px 32px; display: flex; flex-direction: column; gap: 18px">
    <sc-for list="{{groups}}" as="g" hint-placeholder-count="2">
      <section style="display: flex; flex-direction: column; gap: 8px">
        <h2 style="margin: 0; font-size: 12px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 1px">{{g.title}}</h2>
        <sc-for list="{{g.items}}" as="n" hint-placeholder-count="3">
          <a href="{{n.href}}" onClick="{{n.read}}" style="{{n.row}}">
            <div style="{{n.icon}}">
              <sc-if value="{{n.isFlame}}" hint-placeholder-val="{{ true }}"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22c4 0 7-3 7-7 0-4-3-6-4-10-2 2-3 4-3 6-1-1-2-2-2-4-2 2-5 5-5 8 0 4 3 7 7 7z"/></svg></sc-if>
              <sc-if value="{{n.isPerson}}" hint-placeholder-val="{{ false }}"><span style="font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 15px">{{n.initials}}</span></sc-if>
              <sc-if value="{{n.isBell}}" hint-placeholder-val="{{ false }}"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2 2M9 2h6"/></svg></sc-if>
              <sc-if value="{{n.isStar}}" hint-placeholder-val="{{ false }}"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.4 6.8 19.1l1-5.8L3.5 9.2l5.9-.9z"/></svg></sc-if>
              <sc-if value="{{n.isFood}}" hint-placeholder-val="{{ false }}"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 3v8a3 3 0 0 0 6 0V3M7 3v18M17 3c-2 0-3 3-3 6s1 4 3 4v8"/></svg></sc-if>
            </div>
            <div style="display: flex; flex-direction: column; gap: 3px; flex: 1; min-width: 0">
              <span style="font-size: 14px; line-height: 1.4"><strong>{{n.title}}</strong> {{n.body}}</span>
              <span style="font-size: 12px; color: var(--muted)">{{n.time}}</span>
            </div>
            <sc-if value="{{n.unread}}" hint-placeholder-val="{{ true }}">
              <span aria-label="Unread" style="width: 10px; height: 10px; border-radius: 5px; background: var(--accentInk); flex-shrink: 0; margin-top: 6px"></span>
            </sc-if>
          </a>
        </sc-for>
      </section>
    </sc-for>
    <sc-if value="{{empty}}" hint-placeholder-val="{{ false }}">
      <div style="padding: 32px 20px; text-align: center; color: var(--muted); font-size: 14px">You’re all caught up.</div>
    </sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"accent":{"editor":"color","default":"#C6F432","options":["#C6F432","#FF8A4C","#7CC8FF","#E9B8FF"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { tab: 'all', read: { n4: true, n5: true, n6: true, n7: true } };
  }
  theme() {
    let p = {};
    try { p = JSON.parse(window.localStorage.getItem('musclex.prefs') || '{}') || {}; } catch (e) { p = {}; }
    const mode = this.props.theme || p.theme || 'dark';
    const accent = this.props.accent || p.accent || '#C6F432';
    const n = parseInt(accent.slice(1), 16), r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
    const dk = (v) => Math.round(v * 0.48).toString(16).padStart(2, '0');
    const light = mode === 'light';
    const T = light
      ? { bg: '#F5F5F0', surface: '#FFFFFF', surface2: '#ECEDE6', line: '#DEDFD6', text: '#141512', muted: '#5E6158', nav: '#FFFFFF', strong: '#141512', onStrong: '#FFFFFF', flame: '#C2410C', flameSoft: '#FDE7DA', sky: '#1D5FA3', violet: '#7A3FA0' }
      : { bg: '#0E0F0C', surface: '#1A1C17', surface2: '#24271F', line: '#2A2D25', text: '#F2F2EE', muted: '#A3A69C', nav: '#121310', strong: '#F2F2EE', onStrong: '#0E0F0C', flame: '#FF8A4C', flameSoft: '#2A1A10', sky: '#7CC8FF', violet: '#E9B8FF' };
    const vars = Object.keys(T).map((k) => '--' + k + ':' + T[k]).join(';') + ';--accent:' + accent + ';--accentInk:' + (light ? '#' + dk(r) + dk(g) + dk(b) : accent) + ';--accentSoft:rgba(' + r + ',' + g + ',' + b + ',' + (light ? 0.18 : 0.14) + ');--onAccent:#0E0F0C;';
    return { vars, mode, accent, light };
  }
  renderVals() {
    const st = this.state;
    const all = [
      { id: 'n1', g: 'Today', kind: 'flame', type: 'reminders', title: 'Your 23-day streak ends at midnight.', body: 'Push day is still waiting — 55 min.', time: '2 h ago', href: 'Workout.dc.html' },
      { id: 'n2', g: 'Today', kind: 'person', initials: 'PS', tint: '#C6F432', type: 'social', title: 'Priya Sharma', body: 'cheered your bench press PR.', time: '3 h ago', href: 'Athlete.dc.html' },
      { id: 'n3', g: 'Today', kind: 'food', type: 'reminders', title: 'Snacks not logged yet.', body: 'You have 1,080 kcal left today.', time: '4 h ago', href: 'Meals.dc.html' },
      { id: 'n4', g: 'Today', kind: 'person', initials: 'MT', tint: '#FF8A4C', type: 'social', title: 'Marcus Taylor', body: 'started following you.', time: '6 h ago', href: 'Community.dc.html' },
      { id: 'n5', g: 'Earlier this week', kind: 'star', type: 'social', title: 'New personal record!', body: 'Deadlift 140 kg — up 10 kg.', time: 'Sun', href: 'Progress.dc.html' },
      { id: 'n6', g: 'Earlier this week', kind: 'bell', type: 'reminders', title: 'Weekly summary is ready.', body: '5 workouts, 6 of 7 days on target.', time: 'Mon', href: 'FoodDiary.dc.html' },
      { id: 'n7', g: 'Earlier this week', kind: 'person', initials: 'LK', tint: '#7CC8FF', type: 'social', title: 'Leah Kim', body: 'and 12 others cheered your workout.', time: 'Mon', href: 'Community.dc.html' }
    ];
    const vis = all.filter((n) => st.tab === 'all' || n.type === st.tab);
    const unreadCount = all.filter((n) => !st.read[n.id]).length;
    const groups = ['Today', 'Earlier this week'].map((title) => ({
      title,
      items: vis.filter((n) => n.g === title).map((n) => {
        const unread = !st.read[n.id];
        const iconBg = n.kind === 'flame' ? 'background:var(--flameSoft);color:var(--flame);'
          : n.kind === 'person' ? 'background:' + n.tint + ';color:#0E0F0C;'
          : n.kind === 'star' ? 'background:var(--accentSoft);color:var(--accentInk);'
          : 'background:var(--surface2);color:var(--text);';
        return { ...n, unread,
          isFlame: n.kind === 'flame', isPerson: n.kind === 'person', isBell: n.kind === 'bell', isStar: n.kind === 'star', isFood: n.kind === 'food',
          read: () => this.setState({ read: { ...this.state.read, [n.id]: true } }),
          row: 'display:flex;align-items:flex-start;gap:12px;padding:14px;border-radius:16px;text-decoration:none;color:var(--text);' + (unread ? 'background:var(--surface);border:1px solid var(--accentInk);' : 'background:var(--surface);border:1px solid var(--line);'),
          icon: 'width:42px;height:42px;border-radius:21px;flex-shrink:0;display:flex;align-items:center;justify-content:center;' + iconBg };
      })
    })).filter((g) => g.items.length);
    return {
      vars: this.theme().vars,
      tabs: [['all', 'All'], ['social', 'Social'], ['reminders', 'Reminders']].map(([id, label]) => ({ label, on: st.tab === id, pick: () => this.setState({ tab: id }),
        style: 'height:44px;border:0;border-radius:10px;font-size:14px;font-weight:600;' + (st.tab === id ? 'background:var(--strong);color:var(--onStrong);' : 'background:transparent;color:var(--muted);') })),
      groups, empty: groups.length === 0,
      unreadLabel: unreadCount ? unreadCount + ' unread' : 'All read',
      markAll: () => { const r = {}; all.forEach((n) => { r[n.id] = true; }); this.setState({ read: r }); }
    };
  }
}
</script>
</body>
</html>
