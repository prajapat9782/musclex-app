<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>MuscleX · Food diary</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap">
<style>
body{margin:0}
button{font-family:inherit;cursor:pointer}
button:disabled{cursor:default}
</style>
</helmet>
<div style="{{vars}} width: 390px; height: 844px; display: flex; flex-direction: column; background: var(--bg); color: var(--text); font-family: Inter, system-ui, sans-serif; overflow: hidden">
  <div style="padding: 52px 20px 12px; display: flex; flex-direction: column; gap: 14px; flex-shrink: 0">
    <div style="display: flex; align-items: center; gap: 12px">
      <a href="Meals.dc.html" aria-label="Back to meal plan" style="width: 44px; height: 44px; flex-shrink: 0; border-radius: 22px; border: 1px solid var(--line); background: var(--surface); color: var(--text); display: flex; align-items: center; justify-content: center">
        <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>
      </a>
      <h1 style="margin: 0; flex: 1; font-family: 'Space Grotesk', sans-serif; font-size: 24px; font-weight: 700">Food diary</h1>
      <button onClick="{{goToday}}" style="height: 44px; padding: 0 14px; border-radius: 22px; border: 1px solid var(--line); background: var(--surface); color: var(--text); font-size: 14px; font-weight: 600">Today</button>
    </div>
    <div style="display: flex; align-items: center; justify-content: space-between">
      <button onClick="{{prevWeek}}" aria-label="Previous week" style="width: 44px; height: 44px; border-radius: 12px; border: 0; background: transparent; color: var(--text); display: flex; align-items: center; justify-content: center">
        <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>
      </button>
      <span style="font-size: 14px; font-weight: 700">{{weekLabel}}</span>
      <button onClick="{{nextWeek}}" disabled="{{noNext}}" aria-label="Next week" style="{{nextStyle}}">
        <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
      </button>
    </div>
    <div role="group" aria-label="Choose a day" style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px">
      <sc-for list="{{days}}" as="d" hint-placeholder-count="7">
        <button onClick="{{d.pick}}" disabled="{{d.future}}" aria-pressed="{{d.on}}" aria-label="{{d.aria}}" style="{{d.style}}">
          <span style="font-size: 11px; font-weight: 600; opacity: 0.8">{{d.wd}}</span>
          <span style="font-family: 'Space Grotesk', sans-serif; font-size: 17px; font-weight: 700">{{d.num}}</span>
          <span style="{{d.dot}}"></span>
        </button>
      </sc-for>
    </div>
  </div>

  <div style="flex: 1; overflow-y: auto; padding: 6px 20px 32px; display: flex; flex-direction: column; gap: 16px">
    <div style="background: var(--surface); border: 1px solid var(--line); border-radius: 22px; padding: 18px; display: flex; flex-direction: column; gap: 14px">
      <div style="display: flex; justify-content: space-between; align-items: flex-start; gap: 12px">
        <div style="display: flex; flex-direction: column; gap: 4px">
          <span style="font-size: 12px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 1px">{{dayLabel}}</span>
          <span style="font-family: 'Space Grotesk', sans-serif; font-size: 34px; font-weight: 700; letter-spacing: -1px">{{eaten}} <span style="font-size: 15px; color: var(--muted); font-weight: 500; letter-spacing: 0">/ {{target}} kcal</span></span>
        </div>
        <span style="{{statusStyle}}">{{status}}</span>
      </div>
      <div style="height: 10px; border-radius: 5px; background: var(--surface2); overflow: hidden"><div style="{{bar}}"></div></div>
      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px">
        <sc-for list="{{macros}}" as="m" hint-placeholder-count="3">
          <div style="display: flex; flex-direction: column; gap: 4px">
            <span style="font-size: 12px; color: var(--muted)">{{m.label}}</span>
            <span style="font-size: 16px; font-weight: 700">{{m.have}}<span style="font-size: 12px; color: var(--muted); font-weight: 500"> / {{m.goal}} g</span></span>
            <div style="height: 5px; border-radius: 3px; background: var(--surface2); overflow: hidden"><div style="{{m.bar}}"></div></div>
          </div>
        </sc-for>
      </div>
      <span style="font-size: 12px; color: var(--muted); padding-top: 10px; border-top: 1px solid var(--line)">{{weekAvg}}</span>
    </div>

    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
      <a href="Water.dc.html" style="min-height: 64px; padding: 10px 14px; border-radius: 16px; background: var(--surface); border: 1px solid var(--line); color: var(--text); text-decoration: none; display: flex; align-items: center; gap: 10px">
        <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: var(--sky); flex-shrink: 0"><path d="M12 3s6 6.5 6 11a6 6 0 0 1-12 0c0-4.5 6-11 6-11z"/></svg>
        <span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 12px; color: var(--muted)">Water</span><span style="font-size: 15px; font-weight: 700">{{waterLabel}}</span></span>
      </a>
      <button onClick="{{copyPrev}}" style="{{copyStyle}}">
        <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0"><rect x="8" y="8" width="13" height="13" rx="2"/><path d="M16 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h3"/></svg>
        <span style="display: flex; flex-direction: column; gap: 2px; text-align: left"><span style="font-size: 12px; color: var(--muted)">{{copySub}}</span><span style="font-size: 15px; font-weight: 700">{{copyLabel}}</span></span>
      </button>
    </div>

    <sc-for list="{{sections}}" as="sec" hint-placeholder-count="4">
      <section style="background: var(--surface); border: 1px solid var(--line); border-radius: 20px; overflow: hidden">
        <a href="MealDetail.dc.html" onClick="{{sec.open}}" style="display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 56px; padding: 0 16px; color: var(--text); text-decoration: none; border-bottom: 1px solid var(--line)">
          <span style="font-size: 16px; font-weight: 700">{{sec.label}}</span>
          <span style="display: flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 700">{{sec.kcal}}
            <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="color: var(--muted)"><path d="M9 6l6 6-6 6"/></svg>
          </span>
        </a>
        <sc-for list="{{sec.items}}" as="it" hint-placeholder-count="2">
          <div style="display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 10px 16px">
            <div style="display: flex; flex-direction: column; gap: 2px; min-width: 0">
              <span style="font-size: 14px; font-weight: 600">{{it.name}}</span>
              <span style="font-size: 12px; color: var(--muted)">{{it.detail}}</span>
            </div>
            <span style="font-size: 14px; color: var(--muted); white-space: nowrap">{{it.kcal}}</span>
          </div>
        </sc-for>
        <sc-if value="{{sec.empty}}" hint-placeholder-val="{{ false }}">
          <p style="margin: 0; padding: 12px 16px 4px; font-size: 13px; color: var(--muted)">Nothing logged</p>
        </sc-if>
        <a href="FoodLog.dc.html" onClick="{{sec.add}}" style="display: flex; align-items: center; gap: 8px; min-height: 48px; padding: 0 16px; color: var(--accentInk); text-decoration: none; font-size: 14px; font-weight: 700">
          <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Add food</a>
      </section>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"accent":{"editor":"color","default":"#C6F432","options":["#C6F432","#FF8A4C","#7CC8FF","#E9B8FF"]},"$preview":{"width":390,"height":844}}'>

    });
    return {
      vars: this.theme().vars,
      days, noNext,
      nextStyle: 'width:44px;height:44px;border-radius:12px;border:0;background:transparent;color:var(--text);display:flex;align-items:center;justify-content:center;' + (noNext ? 'opacity:0.3;' : ''),
      weekLabel: lbl(st.anchor, { day: 'numeric', month: 'short' }) + ' – ' + lbl(end, { day: 'numeric', month: 'short', year: 'numeric' }),
      prevWeek: () => this.setState({ anchor: this.add(this.state.anchor, -7), sel: this.add(this.state.anchor, -1) }),
      nextWeek: () => { if (!noNext) { const a = this.add(this.state.anchor, 7); this.setState({ anchor: a, sel: a > T ? T : a }); } },
      goToday: () => this.setState({ sel: T, anchor: this.monday(T) }),
      dayLabel: st.sel === T ? 'Today' : st.sel === this.add(T, -1) ? 'Yesterday' : lbl(st.sel, { weekday: 'long', day: 'numeric', month: 'short' }),
      eaten: fmt(tot.kcal), target: fmt(tg.kcal), status,
      statusStyle: 'font-size:13px;font-weight:700;padding:6px 10px;border-radius:10px;white-space:nowrap;' + (list.length === 0 ? 'background:var(--surface2);color:var(--muted);' : within ? 'background:var(--accentSoft);color:var(--accentInk);' : 'background:var(--flameSoft);color:var(--flame);'),
      bar: 'height:100%;border-radius:5px;background:' + (within ? 'var(--accentInk)' : 'var(--flame)') + ';width:' + Math.min(100, Math.round(tot.kcal / tg.kcal * 100)) + '%',
      macros: [mac('Protein', tot.p, tg.protein), mac('Carbs', tot.c, tg.carbs), mac('Fat', tot.f, tg.fat)],
      weekAvg: logged.length ? 'Week average ' + fmt(avg) + ' kcal · ' + logged.length + ' of 7 days logged' : 'No days logged this week',
      sections,
      ...this.extras(tg)
    };
  }
}
</script>
