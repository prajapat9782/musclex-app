<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>MuscleX · Scan barcode</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap">
<style>
body{margin:0}
button,input{font-family:inherit}
button{cursor:pointer}
input::placeholder{color:#8A8D84}
@keyframes mxscan{0%{top:10%}50%{top:86%}100%{top:10%}}
.mx-scan-line{position:absolute;left:6%;right:6%;height:3px;border-radius:2px;animation:mxscan 2.2s ease-in-out infinite}
@media (prefers-reduced-motion: reduce){.mx-scan-line{animation:none;top:48%}}
</style>
</helmet>
<div style="{{vars}} position: relative; width: 390px; height: 844px; display: flex; flex-direction: column; background: #0B0C0A; color: #F2F2EE; font-family: Inter, system-ui, sans-serif; overflow: hidden">
  <div style="padding: 52px 20px 12px; display: flex; align-items: center; gap: 12px; flex-shrink: 0">
    <a href="FoodLog.dc.html" aria-label="Close scanner" style="width: 44px; height: 44px; flex-shrink: 0; border-radius: 22px; background: rgba(255,255,255,0.12); color: #F2F2EE; display: flex; align-items: center; justify-content: center">
      <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
    </a>
    <div style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px">
      <h1 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 20px; font-weight: 700">Scan barcode</h1>
      <span style="font-size: 12px; color: #B7BAB0">Adding to {{slotLabel}}</span>
    </div>
    <button onClick="{{toggleTorch}}" aria-pressed="{{torch}}" aria-label="Flashlight" style="{{torchStyle}}">
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3h10l-2 6v12H9V9z"/><path d="M12 13v3"/></svg>
    </button>
  </div>

  <div style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; padding: 0 24px">
    <div style="position: relative; width: 300px; height: 190px">
      <div style="position: absolute; left: 0; top: 0; width: 36px; height: 36px; border-left: 4px solid var(--accent); border-top: 4px solid var(--accent); border-top-left-radius: 14px"></div>
      <div style="position: absolute; right: 0; top: 0; width: 36px; height: 36px; border-right: 4px solid var(--accent); border-top: 4px solid var(--accent); border-top-right-radius: 14px"></div>
      <div style="position: absolute; left: 0; bottom: 0; width: 36px; height: 36px; border-left: 4px solid var(--accent); border-bottom: 4px solid var(--accent); border-bottom-left-radius: 14px"></div>
      <div style="position: absolute; right: 0; bottom: 0; width: 36px; height: 36px; border-right: 4px solid var(--accent); border-bottom: 4px solid var(--accent); border-bottom-right-radius: 14px"></div>
      <svg aria-hidden="true" width="200" height="96" viewBox="0 0 200 96" style="position: absolute; left: 50px; top: 47px; opacity: 0.35">
        <path d="M4 0v80M12 0v80M16 0v80M26 0v80M32 0v80M36 0v80M46 0v80M54 0v80M58 0v80M66 0v80M76 0v80M80 0v80M90 0v80M96 0v80M104 0v80M110 0v80M114 0v80M124 0v80M130 0v80M138 0v80M142 0v80M152 0v80M158 0v80M162 0v80M172 0v80M178 0v80M186 0v80M196 0v80" stroke="#F2F2EE" stroke-width="3"/>
      </svg>
      <sc-if value="{{scanning}}" hint-placeholder-val="{{ true }}">
        <div class="mx-scan-line" style="background: var(--accent)"></div>
      </sc-if>
    </div>
    <p role="status" style="margin: 0; font-size: 15px; text-align: center; color: #D5D8CE">{{hint}}</p>
    <sc-if value="{{manual}}" hint-placeholder-val="{{ false }}">
      <div style="width: 100%; display: flex; gap: 8px">
        <label style="flex: 1; display: flex">
          <span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Barcode number</span>
          <input type="text" inputmode="numeric" value="{{code}}" onChange="{{onCode}}" placeholder="Barcode number" style="flex: 1; height: 52px; padding: 0 14px; border-radius: 14px; border: 1px solid rgba(255,255,255,0.2); background: rgba(255,255,255,0.08); color: #F2F2EE; font-size: 16px; outline: none">
        </label>
        <button onClick="{{lookup}}" style="height: 52px; padding: 0 18px; border-radius: 14px; border: 0; background: var(--accent); color: var(--onAccent); font-size: 15px; font-weight: 700">Look up</button>
      </div>
    </sc-if>
  </div>

  <div style="flex-shrink: 0; padding: 0 24px 40px; display: flex; justify-content: center">
    <button onClick="{{toggleManual}}" style="height: 48px; padding: 0 20px; border-radius: 24px; border: 1px solid rgba(255,255,255,0.25); background: transparent; color: #F2F2EE; font-size: 14px; font-weight: 600">{{manualLabel}}</button>
  </div>

  <sc-if value="{{found}}" hint-placeholder-val="{{ false }}">
    <div style="position: absolute; inset: 0; background: rgba(0,0,0,0.5); display: flex; flex-direction: column; justify-content: flex-end">
      <div role="dialog" aria-label="Product found" style="background: var(--bg); color: var(--text); border-radius: 28px 28px 0 0; padding: 12px 20px 36px; display: flex; flex-direction: column; gap: 14px">
        <div style="width: 40px; height: 5px; border-radius: 3px; background: var(--line); align-self: center"></div>
        <div style="display: flex; gap: 14px; align-items: center">
          <div style="width: 56px; height: 56px; border-radius: 14px; background: #F2E28A; color: #0E0F0C; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
            <svg aria-hidden="true" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="8" width="18" height="8" rx="2"/><path d="M7 8V6M17 8V6M7 16v2M17 16v2"/></svg>
          </div>
          <div style="display: flex; flex-direction: column; gap: 2px; min-width: 0">
            <span style="font-size: 12px; font-weight: 700; color: var(--accentInk); text-transform: uppercase; letter-spacing: 1px">Product found</span>
            <span style="font-family: 'Space Grotesk', sans-serif; font-size: 19px; font-weight: 700">Protein bar · peanut caramel</span>
            <span style="font-size: 12px; color: var(--muted)">{{codeShown}} · 1 bar (60 g)</span>
          </div>
        </div>
        <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; padding: 12px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line); text-align: center">
          <div style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 18px; font-weight: 700">{{k}}</span><span style="font-size: 11px; color: var(--muted)">kcal</span></div>
          <div style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 18px; font-weight: 700">{{p}}</span><span style="font-size: 11px; color: var(--muted)">protein g</span></div>
          <div style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 18px; font-weight: 700">{{c}}</span><span style="font-size: 11px; color: var(--muted)">carbs g</span></div>
          <div style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 18px; font-weight: 700">{{f}}</span><span style="font-size: 11px; color: var(--muted)">fat g</span></div>
        </div>
        <div style="display: flex; align-items: center; justify-content: space-between">
          <span style="font-size: 14px; color: var(--muted)">Servings</span>
          <div style="display: flex; align-items: center; gap: 8px">
            <button onClick="{{dec}}" aria-label="Fewer servings" style="width: 44px; height: 44px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface2); color: var(--text); font-size: 20px; font-weight: 700">−</button>
            <span style="min-width: 44px; text-align: center; font-family: 'Space Grotesk', sans-serif; font-size: 20px; font-weight: 700">{{qty}}</span>
            <button onClick="{{inc}}" aria-label="More servings" style="width: 44px; height: 44px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface2); color: var(--text); font-size: 20px; font-weight: 700">+</button>
          </div>
        </div>
        <sc-if value="{{notAdded}}" hint-placeholder-val="{{ true }}">
          <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
            <button onClick="{{rescan}}" style="height: 52px; border-radius: 16px; border: 1px solid var(--line); background: var(--surface); color: var(--text); font-size: 15px; font-weight: 600">Not right? Rescan</button>
            <button onClick="{{add}}" style="height: 52px; border-radius: 16px; border: 0; background: var(--accent); color: var(--onAccent); font-size: 15px; font-weight: 700">Add to {{slotLabel}}</button>
          </div>
        </sc-if>
        <sc-if value="{{added}}" hint-placeholder-val="{{ false }}">
          <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
            <button onClick="{{rescan}}" style="height: 52px; border-radius: 16px; border: 1px solid var(--line); background: var(--surface); color: var(--text); font-size: 15px; font-weight: 600">Scan another</button>
            <a href="FoodLog.dc.html" style="height: 52px; border-radius: 16px; background: var(--accent); color: var(--onAccent); font-size: 15px; font-weight: 700; text-decoration: none; display: flex; align-items: center; justify-content: center">Added · Done</a>
          </div>
        </sc-if>
      </div>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"accent":{"editor":"color","default":"#C6F432","options":["#C6F432","#FF8A4C","#7CC8FF","#E9B8FF"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    let v = {};
    try { v = JSON.parse(window.localStorage.getItem('musclex.view') || '{}') || {}; } catch (e) { v = {}; }
    this.view = v;
    this.state = { phase: 'scanning', torch: false, manual: false, code: '', qty: 1 };
  }
  componentDidMount() { this.arm(); }
  componentWillUnmount() { clearTimeout(this.t); }
  arm() {
    clearTimeout(this.t);
    this.t = setTimeout(() => { if (this.state.phase === 'scanning') this.setState({ phase: 'found' }); }, 2400);
  }
  theme() {
    let p = {};
    try { p = JSON.parse(window.localStorage.getItem('musclex.prefs') || '{}') || {}; } catch (e) { p = {}; }
    const mode = this.props.theme || p.theme || 'dark';
    const accent = this.props.accent || p.accent || '#C6F432';
    const n = parseInt(accent.slice(1), 16), r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
    const dk = (v) => Math.round(v * 0.48).toString(16).padStart(2, '0');
    const light = mode === 'light';
    const T = light
      ? { bg: '#F5F5F0', surface: '#FFFFFF', surface2: '#ECEDE6', line: '#DEDFD6', text: '#141512', muted: '#5E6158', nav: '#FFFFFF', strong: '#141512', onStrong: '#FFFFFF', flame: '#C2410C', flameSoft: '#FDE7DA', sky: '#1D5FA3', violet: '#7A3FA0' }
      : { bg: '#0E0F0C', surface: '#1A1C17', surface2: '#24271F', line: '#2A2D25', text: '#F2F2EE', muted: '#A3A69C', nav: '#121310', strong: '#F2F2EE', onStrong: '#0E0F0C', flame: '#FF8A4C', flameSoft: '#2A1A10', sky: '#7CC8FF', violet: '#E9B8FF' };
    const vars = Object.keys(T).map((k) => '--' + k + ':' + T[k]).join(';') + ';--accent:' + accent + ';--accentInk:' + (light ? '#' + dk(r) + dk(g) + dk(b) : accent) + ';--accentSoft:rgba(' + r + ',' + g + ',' + b + ',' + (light ? 0.18 : 0.14) + ');--onAccent:#0E0F0C;';
    return { vars, mode, accent, light };
  }
  addToDiary() {
    const date = this.view.date || '2026-11-25';
    const slot = this.view.slot || 'snack';
    let d = {};
    try { d = JSON.parse(window.localStorage.getItem('musclex.diary') || '{}') || {}; } catch (e) { d = {}; }
    d[date] = (d[date] || []).concat([{ u: 'u' + Date.now(), s: slot, n: 'Protein bar · peanut caramel', sv: '1 bar · 60 g', k: 210, p: 20, c: 22, x: 7, q: this.state.qty }]);
    try { window.localStorage.setItem('musclex.diary', JSON.stringify(d)); } catch (e) {}
    this.setState({ phase: 'added' });
  }
  renderVals() {
    const st = this.state;
    const slotLabel = { breakfast: 'Breakfast', lunch: 'Lunch', snack: 'Snacks', dinner: 'Dinner' }[this.view.slot || 'snack'];
    const r1 = (n) => Math.round(n * 10) / 10;
    return {
      vars: this.theme().vars,
      slotLabel,
      scanning: st.phase === 'scanning',
      found: st.phase !== 'scanning', added: st.phase === 'added', notAdded: st.phase === 'found',
      hint: st.manual ? 'Type the number printed under the barcode' : 'Line up the barcode inside the frame',
      torch: st.torch,
      toggleTorch: () => this.setState({ torch: !this.state.torch }),
      torchStyle: 'width:44px;height:44px;flex-shrink:0;border-radius:22px;border:0;display:flex;align-items:center;justify-content:center;' + (st.torch ? 'background:var(--accent);color:var(--onAccent);' : 'background:rgba(255,255,255,0.12);color:#F2F2EE;'),
      manual: st.manual,
      manualLabel: st.manual ? 'Use camera instead' : 'Enter barcode manually',
      toggleManual: () => { const m = !this.state.manual; this.setState({ manual: m }); if (m) clearTimeout(this.t); else this.arm(); },
      code: st.code, onCode: (e) => this.setState({ code: e.target.value.replace(/[^0-9]/g, '') }),
      lookup: () => { if (this.state.code.length >= 8) this.setState({ phase: 'found' }); },
      codeShown: 'Barcode ' + (st.code || '5012345678900'),
      qty: st.qty,
      dec: () => this.setState({ qty: Math.max(0.5, this.state.qty - 0.5) }),
      inc: () => this.setState({ qty: this.state.qty + 0.5 }),
      k: Math.round(210 * st.qty), p: r1(20 * st.qty), c: r1(22 * st.qty), f: r1(7 * st.qty),
      add: () => this.addToDiary(),
      rescan: () => { this.setState({ phase: 'scanning', qty: 1, manual: false, code: '' }); this.arm(); }
    };
  }
}
</script>
</body>
</html>
