<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>MuscleX · Meal details</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap">
<style>
body{margin:0}
button{font-family:inherit;cursor:pointer}
</style>
</helmet>
<div style="{{vars}} width: 390px; height: 844px; display: flex; flex-direction: column; background: var(--bg); color: var(--text); font-family: Inter, system-ui, sans-serif; overflow: hidden">
  <div style="padding: 52px 20px 12px; display: flex; flex-direction: column; gap: 14px; flex-shrink: 0">
    <div style="display: flex; align-items: center; gap: 12px">
      <a href="{{backHref}}" aria-label="Back" style="width: 44px; height: 44px; flex-shrink: 0; border-radius: 22px; border: 1px solid var(--line); background: var(--surface); color: var(--text); display: flex; align-items: center; justify-content: center">
        <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>
      </a>
      <div style="display: flex; flex-direction: column; gap: 2px">
        <h1 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 24px; font-weight: 700">{{slotLabel}}</h1>
        <span style="font-size: 13px; color: var(--muted)">{{dateLabel}}</span>
      </div>
    </div>
    <div role="group" aria-label="Meal" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px; padding: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px">
      <sc-for list="{{slots}}" as="s" hint-placeholder-count="4">
        <button onClick="{{s.pick}}" aria-pressed="{{s.on}}" style="{{s.style}}">{{s.label}}</button>
      </sc-for>
    </div>
  </div>

  <div style="flex: 1; overflow-y: auto; padding: 4px 20px 24px; display: flex; flex-direction: column; gap: 14px">
    <div style="background: var(--surface); border: 1px solid var(--line); border-radius: 22px; padding: 18px; display: flex; flex-direction: column; gap: 14px">
      <div style="display: flex; justify-content: space-between; align-items: flex-end">
        <div style="display: flex; flex-direction: column; gap: 4px">
          <span style="font-size: 12px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 1px">Meal total</span>
          <span style="font-family: 'Space Grotesk', sans-serif; font-size: 40px; font-weight: 700; line-height: 1; letter-spacing: -1px">{{kcal}} <span style="font-size: 15px; color: var(--muted); font-weight: 500; letter-spacing: 0">kcal</span></span>
        </div>
        <span style="font-size: 13px; color: var(--muted); text-align: right">{{shareOfDay}}</span>
      </div>
      <div style="display: flex; height: 12px; border-radius: 6px; overflow: hidden; gap: 2px; background: var(--surface2)">
        <div style="{{pBar}}"></div><div style="{{cBar}}"></div><div style="{{fBar}}"></div>
      </div>
      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px">
        <sc-for list="{{macros}}" as="m" hint-placeholder-count="3">
          <div style="display: flex; flex-direction: column; gap: 2px">
            <span style="font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px"><span style="{{m.dot}}"></span>{{m.label}}</span>
            <span style="font-family: 'Space Grotesk', sans-serif; font-size: 20px; font-weight: 700">{{m.g}} g</span>
            <span style="font-size: 12px; color: var(--muted)">{{m.pct}}% of kcal</span>
          </div>
        </sc-for>
      </div>
    </div>

    <div style="display: flex; justify-content: space-between; align-items: baseline">
      <h2 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 18px; font-weight: 700">Foods</h2>
      <span style="font-size: 13px; color: var(--muted)">{{count}}</span>
    </div>
    <sc-for list="{{items}}" as="it" hint-placeholder-count="4">
      <div style="padding: 12px 12px 12px 14px; border-radius: 16px; background: var(--surface); border: 1px solid var(--line); display: flex; flex-direction: column; gap: 10px">
        <div style="display: flex; justify-content: space-between; gap: 12px">
          <div style="display: flex; flex-direction: column; gap: 2px; min-width: 0">
            <span style="font-size: 15px; font-weight: 600">{{it.name}}</span>
            <span style="font-size: 12px; color: var(--muted)">{{it.macros}}</span>
          </div>
          <span style="font-size: 15px; font-weight: 700; white-space: nowrap">{{it.kcal}} kcal</span>
        </div>
        <div style="display: flex; align-items: center; gap: 8px">
          <button onClick="{{it.dec}}" aria-label="{{it.decLabel}}" style="width: 44px; height: 40px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface2); color: var(--text); font-size: 18px; font-weight: 700">−</button>
          <span style="flex: 1; text-align: center; font-size: 13px; font-weight: 600">{{it.portion}}</span>
          <button onClick="{{it.inc}}" aria-label="{{it.incLabel}}" style="width: 44px; height: 40px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface2); color: var(--text); font-size: 18px; font-weight: 700">+</button>
          <button onClick="{{it.remove}}" aria-label="{{it.removeLabel}}" style="width: 44px; height: 40px; border-radius: 10px; border: 0; background: var(--flameSoft); color: var(--flame); display: flex; align-items: center; justify-content: center">
            <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>
          </button>
        </div>
      </div>
    </sc-for>
    <sc-if value="{{hasItems}}" hint-placeholder-val="{{ true }}">
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
        <button onClick="{{startSave}}" style="{{saveBtn}}">{{saveLabel}}</button>
        <button onClick="{{copy}}" style="{{copyBtn}}">{{copyLabel}}</button>
      </div>
    </sc-if>
    <sc-if value="{{showCopyPrev}}" hint-placeholder-val="{{ false }}">
      <button onClick="{{copy}}" style="{{copyBtn}}">{{copyLabel}}</button>
    </sc-if>
    <sc-if value="{{saving}}" hint-placeholder-val="{{ false }}">
      <div style="padding: 14px; border-radius: 16px; background: var(--surface); border: 1px solid var(--accentInk); display: flex; flex-direction: column; gap: 10px">
        <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600; color: var(--muted)">Name this meal
          <input type="text" value="{{mealName}}" onChange="{{onName}}" placeholder="e.g. Usual lunch" style="height: 48px; padding: 0 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface2); color: var(--text); font-size: 16px; font-family: inherit; outline: none">
        </label>
        <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
          <button onClick="{{cancelSave}}" style="height: 44px; border-radius: 12px; border: 1px solid var(--line); background: transparent; color: var(--text); font-size: 14px; font-weight: 600">Cancel</button>
          <button onClick="{{confirmSave}}" style="height: 44px; border-radius: 12px; border: 0; background: var(--accent); color: var(--onAccent); font-size: 14px; font-weight: 700">Save</button>
        </div>
      </div>
    </sc-if>
    <sc-if value="{{empty}}" hint-placeholder-val="{{ false }}">
      <div style="padding: 28px 20px; border-radius: 18px; border: 1px dashed var(--line); text-align: center; display: flex; flex-direction: column; gap: 6px">
        <span style="font-size: 15px; font-weight: 600">Nothing logged for {{slotLower}}</span>
        <span style="font-size: 13px; color: var(--muted)">Add foods and the totals update on their own.</span>
      </div>
    </sc-if>
  </div>

  <div style="flex-shrink: 0; padding: 12px 20px 32px; border-top: 1px solid var(--line); background: var(--nav)">
    <a href="FoodLog.dc.html" onClick="{{goAdd}}" style="height: 52px; border-radius: 16px; background: var(--accent); color: var(--onAccent); font-size: 15px; font-weight: 700; text-decoration: none; display: flex; align-items: center; justify-content: center; gap: 8px">
      <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Add food to {{slotLower}}</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"accent":{"editor":"color","default":"#C6F432","options":["#C6F432","#FF8A4C","#7CC8FF","#E9B8FF"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.TODAY = '2026-11-25';
    let v = {};
    try { v = JSON.parse(window.localStorage.getItem('musclex.view') || '{}') || {}; } catch (e) { v = {}; }
    this.view = v;
    this.state = { date: v.date || this.TODAY, slot: v.slot || 'breakfast', diary: this.loadDiary(), saving: false, mealName: '', saved: {}, copied: {} };
  }
  theme() {
    let p = {};
    try { p = JSON.parse(window.localStorage.getItem('musclex.prefs') || '{}') || {}; } catch (e) { p = {}; }
    const mode = this.props.theme || p.theme || 'dark';
    const accent = this.props.accent || p.accent || '#C6F432';
    const n = parseInt(accent.slice(1), 16), r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
    const dk = (v) => Math.round(v * 0.48).toString(16).padStart(2, '0');
    const light = mode === 'light';
    const T = light
      ? { bg: '#F5F5F0', surface: '#FFFFFF', surface2: '#ECEDE6', line: '#DEDFD6', text: '#141512', muted: '#5E6158', nav: '#FFFFFF', strong: '#141512', onStrong: '#FFFFFF', flame: '#C2410C', flameSoft: '#FDE7DA', sky: '#1D5FA3', violet: '#7A3FA0' }
      : { bg: '#0E0F0C', surface: '#1A1C17', surface2: '#24271F', line: '#2A2D25', text: '#F2F2EE', muted: '#A3A69C', nav: '#121310', strong: '#F2F2EE', onStrong: '#0E0F0C', flame: '#FF8A4C', flameSoft: '#2A1A10', sky: '#7CC8FF', violet: '#E9B8FF' };
    const vars = Object.keys(T).map((k) => '--' + k + ':' + T[k]).join(';') + ';--accent:' + accent + ';--accentInk:' + (light ? '#' + dk(r) + dk(g) + dk(b) : accent) + ';--accentSoft:rgba(' + r + ',' + g + ',' + b + ',' + (light ? 0.18 : 0.14) + ');--onAccent:#0E0F0C;';
    return { vars, mode, accent, light };
  }
  lib() {
    const FOODS = {
      oats: ['Rolled oats', '50 g', 190, 7, 32, 3.5], whey: ['Whey protein', '1 scoop · 30 g', 120, 24, 3, 1.5], banana: ['Banana', '1 medium', 105, 1.3, 27, 0.4],
      pb: ['Peanut butter', '1 tbsp · 16 g', 95, 3.5, 3, 8], chicken: ['Chicken breast', '150 g cooked', 248, 46, 0, 5.4], rice: ['White rice', '1 cup cooked', 205, 4.3, 45, 0.4],
      avocado: ['Avocado', '½ fruit', 120, 1.5, 6, 11], greens: ['Mixed salad greens', '1 bowl', 20, 1.5, 3.5, 0.3], yogurt: ['Greek yogurt 2%', '170 g', 150, 17, 8, 4],
      berries: ['Mixed berries', '1 cup', 70, 1, 17, 0.5], honey: ['Honey', '1 tsp', 21, 0, 6, 0], salmon: ['Salmon fillet', '150 g', 312, 34, 0, 19],
      sweetpotato: ['Sweet potato', '1 medium', 112, 2, 26, 0.1], broccoli: ['Broccoli', '1 cup', 31, 2.5, 6, 0.3], eggs: ['Whole eggs', '2 large', 143, 12.6, 0.7, 9.5],
      toast: ['Wholegrain toast', '1 slice', 80, 4, 14, 1], paneer: ['Paneer', '100 g', 265, 18, 1.2, 21], dal: ['Dal (lentil curry)', '1 cup', 230, 13, 32, 6],
      roti: ['Roti / chapati', '1 piece', 120, 3, 18, 3.7], milk: ['Milk 2%', '250 ml', 122, 8, 12, 4.8], almonds: ['Almonds', '28 g', 164, 6, 6, 14],
      apple: ['Apple', '1 medium', 95, 0.5, 25, 0.3], pasta: ['Pasta', '1 cup cooked', 220, 8, 43, 1.3], beef: ['Lean beef mince', '150 g cooked', 330, 39, 0, 19],
      tofu: ['Firm tofu', '150 g', 215, 23, 5, 12], oil: ['Olive oil', '1 tbsp', 119, 0, 0, 13.5]
    };
    const SEED = {
      '2026-11-19': [['breakfast', 'eggs', 1], ['breakfast', 'toast', 2], ['lunch', 'chicken', 1], ['lunch', 'rice', 1.5], ['snack', 'whey', 1], ['snack', 'banana', 1], ['dinner', 'dal', 1], ['dinner', 'roti', 2], ['dinner', 'paneer', 1]],
      '2026-11-20': [['breakfast', 'oats', 1.5], ['breakfast', 'whey', 1], ['breakfast', 'pb', 1], ['lunch', 'beef', 1], ['lunch', 'pasta', 1.5], ['snack', 'almonds', 1], ['dinner', 'salmon', 1], ['dinner', 'sweetpotato', 2], ['dinner', 'broccoli', 1]],
      '2026-11-21': [['breakfast', 'yogurt', 1], ['breakfast', 'berries', 1], ['lunch', 'chicken', 1], ['lunch', 'rice', 1], ['lunch', 'avocado', 1], ['dinner', 'tofu', 1], ['dinner', 'rice', 1], ['dinner', 'broccoli', 1]],
      '2026-11-22': [['breakfast', 'eggs', 1.5], ['breakfast', 'toast', 2], ['breakfast', 'milk', 1], ['lunch', 'dal', 1.5], ['lunch', 'roti', 3], ['snack', 'apple', 1], ['snack', 'almonds', 1], ['dinner', 'chicken', 1.5], ['dinner', 'pasta', 1.5], ['dinner', 'oil', 1]],
      '2026-11-23': [['breakfast', 'oats', 1.5], ['breakfast', 'whey', 1], ['breakfast', 'banana', 1], ['lunch', 'paneer', 1], ['lunch', 'roti', 2], ['lunch', 'greens', 1], ['snack', 'yogurt', 1], ['dinner', 'beef', 1], ['dinner', 'rice', 1.5], ['dinner', 'broccoli', 1]],
      '2026-11-24': [['breakfast', 'oats', 1], ['breakfast', 'whey', 1], ['breakfast', 'pb', 2], ['lunch', 'chicken', 1], ['lunch', 'rice', 1.5], ['lunch', 'avocado', 1], ['snack', 'whey', 1], ['snack', 'milk', 1], ['dinner', 'salmon', 1], ['dinner', 'sweetpotato', 1.5], ['dinner', 'broccoli', 1]],
      '2026-11-25': [['breakfast', 'oats', 1.5], ['breakfast', 'whey', 1], ['breakfast', 'banana', 1], ['breakfast', 'pb', 1.5], ['lunch', 'chicken', 1.25], ['lunch', 'rice', 1.5], ['lunch', 'avocado', 1], ['lunch', 'greens', 1]]
    };
    return { FOODS, SEED, SLOTS: [['breakfast', 'Breakfast'], ['lunch', 'Lunch'], ['snack', 'Snacks'], ['dinner', 'Dinner']] };
  }
  loadDiary() {
    let d = null;
    try { d = JSON.parse(window.localStorage.getItem('musclex.diary') || 'null'); } catch (e) { d = null; }
    if (!d || typeof d !== 'object') {
      const S = this.lib().SEED;
      d = {};
      Object.keys(S).forEach((k) => { d[k] = S[k].map((e, i) => ({ u: k + '-' + i, s: e[0], f: e[1], q: e[2] })); });
      try { window.localStorage.setItem('musclex.diary', JSON.stringify(d)); } catch (e) {}
    }
    return d;
  }
  nut(e) {
    const b = e.f ? this.lib().FOODS[e.f] : [e.n, e.sv || 'Custom', e.k, e.p, e.c, e.x];
    if (!b) return { name: 'Unknown', serving: '', kcal: 0, p: 0, c: 0, f: 0 };
    return { name: b[0], serving: b[1], kcal: (b[2] || 0) * e.q, p: (b[3] || 0) * e.q, c: (b[4] || 0) * e.q, f: (b[5] || 0) * e.q };
  }
  target() {
    let s = {};
    try { s = JSON.parse(window.localStorage.getItem('musclex.profile') || '{}') || {}; } catch (e) { s = {}; }
    const p = Object.assign({ sex: 'male', age: 26, height: 178, weight: 72, goal: 'muscle', activity: 'moderate' }, s);
    const goals = { lose: -500, gain: 500, muscle: 300, maintain: 0, recomp: -200 };
    const acts = { sedentary: 1.2, light: 1.375, moderate: 1.55, very: 1.725, athlete: 1.9 };
    const bmr = 10 * p.weight + 6.25 * p.height - 5 * p.age + (p.sex === 'male' ? 5 : -161);
    return Math.max(p.sex === 'male' ? 1500 : 1200, Math.round((bmr * (acts[p.activity] || 1.55) + (goals[p.goal] || 300)) / 10) * 10);
  }
  actions(list, slotLabel) {
    const st = this.state, T = this.TODAY;
    const key = st.date + ':' + st.slot;
    const isToday = st.date === T;
    const prevDay = (() => { const d = new Date(st.date + 'T12:00:00'); d.setDate(d.getDate() - 1); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); })();
    const prevList = (st.diary[prevDay] || []).filter((e) => e.s === st.slot);
    const copied = !!st.copied[key];
    const saved = !!st.saved[key];
    const strip = (e) => { const o = { q: e.q }; ['f', 'n', 'sv', 'k', 'p', 'c', 'x'].forEach((k) => { if (e[k] !== undefined) o[k] = e[k]; }); return o; };
    const copy = () => {
      if (copied) return;
      const d = Object.assign({}, st.diary);
      if (list.length && !isToday) {
        d[T] = (d[T] || []).concat(list.map((e, i) => Object.assign(strip(e), { u: 'c' + Date.now() + i, s: st.slot })));
      } else {
        d[st.date] = (d[st.date] || []).concat(prevList.map((e, i) => Object.assign(strip(e), { u: 'c' + Date.now() + i, s: st.slot })));
      }
      try { window.localStorage.setItem('musclex.diary', JSON.stringify(d)); } catch (e) {}
      this.setState({ diary: d, copied: Object.assign({}, st.copied, { [key]: true }) });
    };
    const canPrev = prevList.length > 0;
    const copyFromPrev = !list.length || isToday;
    const btn = 'height:48px;border-radius:14px;font-size:14px;font-weight:700;width:100%;';
    return {
      hasItems: list.length > 0,
      showCopyPrev: list.length === 0 && canPrev,
      copy,
      copyLabel: copied ? 'Copied' : copyFromPrev ? (canPrev ? 'Repeat yesterday’s ' + slotLabel.toLowerCase() : 'Nothing yesterday') : 'Copy to today',
      copyBtn: btn + (copied || (copyFromPrev && !canPrev) ? 'border:1px solid var(--line);background:var(--surface2);color:var(--muted);' : 'border:1px solid var(--line);background:var(--surface);color:var(--text);'),
      saving: st.saving,
      saveLabel: saved ? 'Saved to My meals' : 'Save as my meal',
      saveBtn: btn + (saved ? 'border:0;background:var(--accentSoft);color:var(--accentInk);' : 'border:1px solid var(--line);background:var(--surface);color:var(--text);'),
      startSave: () => { if (!saved) this.setState({ saving: true, mealName: this.state.mealName || ('My ' + slotLabel.toLowerCase()) }); },
      cancelSave: () => this.setState({ saving: false }),
      mealName: st.mealName,
      onName: (e) => this.setState({ mealName: e.target.value }),
      confirmSave: () => {
        let m = null;
        try { m = JSON.parse(window.localStorage.getItem('musclex.mymeals') || 'null'); } catch (e) { m = null; }
        if (!Array.isArray(m)) m = [];
        m = m.concat([{ id: 'm' + Date.now(), name: this.state.mealName.trim() || ('My ' + slotLabel.toLowerCase()), items: list.map(strip) }]);
        try { window.localStorage.setItem('musclex.mymeals', JSON.stringify(m)); } catch (e) {}
        this.setState({ saving: false, saved: Object.assign({}, this.state.saved, { [key]: true }) });
      }
    };
  }
  update(u, fn) {
    const d = Object.assign({}, this.state.diary);
    d[this.state.date] = (d[this.state.date] || []).map((e) => e.u === u ? fn(e) : e).filter(Boolean);
    try { window.localStorage.setItem('musclex.diary', JSON.stringify(d)); } catch (e) {}
    this.setState({ diary: d });
  }
  renderVals() {
    const st = this.state;
    const r1 = (n) => Math.round(n * 10) / 10;
    const SL = this.lib().SLOTS;
    const slotLabel = (SL.find((s) => s[0] === st.slot) || SL[0])[1];
    const list = (st.diary[st.date] || []).filter((e) => e.s === st.slot);
    const tot = list.reduce((a, e) => { const n = this.nut(e); a.kcal += n.kcal; a.p += n.p; a.c += n.c; a.f += n.f; return a; }, { kcal: 0, p: 0, c: 0, f: 0 });
    const kp = tot.p * 4, kc = tot.c * 4, kf = tot.f * 9, ks = Math.max(1, kp + kc + kf);
    const pct = (k) => Math.round(k / ks * 100);
    const seg = (k, c) => 'height:100%;background:' + c + ';width:' + (tot.kcal ? pct(k) : 0) + '%';
    const items = list.map((e) => {

        macros: 'P ' + r1(n.p) + ' g · C ' + r1(n.c) + ' g · F ' + r1(n.f) + ' g',
        portion: e.f ? (e.q + ' × ' + n.serving) : 'Custom · ' + e.q + ' serving' + (e.q === 1 ? '' : 's'),
        dec: () => this.update(e.u, (x) => ({ ...x, q: Math.max(0.25, x.q - 0.25) })),
        inc: () => this.update(e.u, (x) => ({ ...x, q: x.q + 0.25 })),
        remove: () => this.update(e.u, () => null),
        decLabel: 'Less ' + n.name, incLabel: 'More ' + n.name, removeLabel: 'Remove ' + n.name
      };
    });
    const dayLabel = st.date === this.TODAY ? 'Today' : new Date(st.date + 'T12:00:00').toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long' });
    return {
      vars: this.theme().vars,
      backHref: this.view.parent || 'Meals.dc.html',
      slotLabel, slotLower: slotLabel.toLowerCase(), dateLabel: dayLabel,
      slots: SL.map(([id, label]) => ({ label, on: st.slot === id, pick: () => this.setState({ slot: id }),
        style: 'height:44px;border:0;border-radius:10px;font-size:13px;font-weight:600;' + (st.slot === id ? 'background:var(--strong);color:var(--onStrong);' : 'background:transparent;color:var(--muted);') })),
      kcal: Math.round(tot.kcal).toLocaleString('en-US'),
      shareOfDay: Math.round(tot.kcal / this.target() * 100) + '% of your daily target',
      pBar: seg(kp, 'var(--accentInk)'), cBar: seg(kc, 'var(--sky)'), fBar: seg(kf, 'var(--flame)'),
      macros: [
        { label: 'Protein', g: r1(tot.p), pct: tot.kcal ? pct(kp) : 0, dot: 'width:8px;height:8px;border-radius:4px;background:var(--accentInk)' },
        { label: 'Carbs', g: r1(tot.c), pct: tot.kcal ? pct(kc) : 0, dot: 'width:8px;height:8px;border-radius:4px;background:var(--sky)' },
        { label: 'Fat', g: r1(tot.f), pct: tot.kcal ? pct(kf) : 0, dot: 'width:8px;height:8px;border-radius:4px;background:var(--flame)' }
      ],
      items, empty: items.length === 0,
      ...this.actions(list, slotLabel),
      count: items.length + (items.length === 1 ? ' food' : ' foods'),
      goAdd: () => { try { window.localStorage.setItem('musclex.view', JSON.stringify({ date: this.state.date, slot: this.state.slot, from: 'MealDetail.dc.html', parent: this.view.parent || 'Meals.dc.html' })); } catch (e) {} }
    };
  }
}
</script>
</body>
</html>
